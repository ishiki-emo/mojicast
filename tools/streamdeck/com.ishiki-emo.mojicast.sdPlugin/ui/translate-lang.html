<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>翻訳先の切替</title>
  <script src="sdpi-components.js"></script>
  <style>.hint { font-size: 9pt; opacity: .75; line-height: 1.5; }</style>
</head>
<body>
  <sdpi-item label="翻訳先">
    <sdpi-select setting="lang" datasource="getChoices" hot-reload placeholder="選んでください"></sdpi-select>
  </sdpi-item>
  <sdpi-item label="名前">
    <sdpi-checkbox setting="hideName" label="ボタンに名前を出さない"></sdpi-checkbox>
  </sdpi-item>
  <sdpi-item label="">
    <span class="hint">翻訳もオンになります。認識中に押すと、反映のため認識が数秒止まります。</span>
  </sdpi-item>
  <sdpi-item label="接続キー">
    <sdpi-password setting="key" global placeholder="Mojicastで発行したキー"></sdpi-password>
  </sdpi-item>
  <sdpi-item label="ポート">
    <sdpi-textfield setting="port" global placeholder="8765"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item label="">
    <span class="hint">キーは Mojicast の［アプリ設定］→［AI連携］→［Stream Deckと接続する］で発行します。接続設定は全ボタン共通です。</span>
  </sdpi-item>
</body>
</html>
