# CTranslate2 の MKL なし wheel を作る（手動実行専用）
#
# Mojicast の Windows 版は、SignPath Foundation の署名条件（同梱物がすべて OSI 承認ライセンス）を
# 満たすため、公式の ctranslate2 wheel（Intel oneMKL と Intel OpenMP を含む）の代わりに、
# tools/signing/ct2_nomkl/build.ps1 でソースからビルドした wheel を使う。
# このワークフローは wheel だけを作って artifact に置く（比較ツール用・確認用）。
# リリースビルド（release-build-windows.yml）は同じスクリプトを同じジョブの中で実行する。
# 手順とオプション: docs/signing/CT2_NOMKL_BUILD.md
name: Build CTranslate2 without MKL (Windows, manual)

on:
  workflow_dispatch:
    inputs:
      openmp:
        description: "OpenMP ランタイム（llvm = 採用・clang-cl＋libomp / msvc = 比較用・cl＋vcomp140）"
        required: false
        default: "llvm"
        type: choice
        options: [llvm, msvc]

permissions:
  contents: read

jobs:
  build:
    name: ctranslate2 4.8.1+nomkl (windows-x64, cp311)
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.5"

      - name: Build
        run: |
          uv python install 3.11.15
          $py = (uv python find 3.11.15).Trim()
          .\tools\signing\ct2_nomkl\build.ps1 -Python $py -OpenMP "${{ inputs.openmp }}" `
            -WorkDir "$env:RUNNER_TEMP\ct2" -OutDir "$PWD\ct2-dist"

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ctranslate2-4.8.1-nomkl-${{ inputs.openmp }}-win-x64-cp311
          path: ct2-dist/
          if-no-files-found: error
          retention-days: 30
