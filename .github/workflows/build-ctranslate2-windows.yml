# CTranslate2 の MKL なし wheel を作る（MSVC＋vcomp140・計測と確認用）
#
# Mojicast の Windows 版を SignPath Foundation で署名するには、同梱物がすべて OSI 承認ライセンス
# である必要がある。公式の ctranslate2 wheel は Intel oneMKL と Intel OpenMP を含むため、
# tools/signing/ct2_nomkl/build.ps1 でソースからビルドした wheel に替える案を検討している
# （採用は Intel 2台＋AMD の実測のあと。それまでリリースの既定は公式版）。
# このワークフローは毎回キャッシュを使わずにビルドし（CI でのビルド時間を測るため）、
# wheel を artifact に置き、同じ鍵でキャッシュにも保存する。
# リリースビルド（release-build-windows.yml）は同じスクリプトと同じ鍵を使う。
# 手順とオプション: docs/signing/CT2_NOMKL_BUILD.md
name: Build CTranslate2 without MKL (Windows)

on:
  workflow_dispatch:
  # workflow_dispatch は既定ブランチにこのファイルが入るまで使えないので、ビルド手順を
  # 変えたときは push でも走らせる（ビルド時間の実測を兼ねる）
  push:
    branches: [chore/signpath-prep]
    paths:
      - tools/signing/ct2_nomkl/**
      - .github/workflows/build-ctranslate2-windows.yml

permissions:
  contents: read

jobs:
  build:
    name: ctranslate2 4.8.1+nomkl (windows-x64, cp311, msvc+vcomp)
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.5"

      - name: Cache key
        id: key
        run: |
          uv python install 3.11.15
          $py = (uv python find 3.11.15).Trim()
          "python=$py" >> $env:GITHUB_OUTPUT
          $tc = (.\tools\signing\ct2_nomkl\build.ps1 -Python $py -PrintToolchain | Select-Object -Last 1).Trim()
          "toolchain=$tc" >> $env:GITHUB_OUTPUT
          Write-Host "toolchain: $tc / runner image: $env:ImageVersion"

      - name: Build
        run: |
          .\tools\signing\ct2_nomkl\build.ps1 -Python "${{ steps.key.outputs.python }}" `
            -WorkDir "$env:RUNNER_TEMP\ct2" -OutDir "$PWD\ct2-dist"
          Get-Content ct2-dist\build-info.json

      - name: Save to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ct2-dist
          key: ct2-nomkl-${{ steps.key.outputs.toolchain }}-py3.11.15-${{ hashFiles('tools/signing/ct2_nomkl/build.ps1', 'tools/signing/ct2_nomkl/probe.py') }}

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ctranslate2-4.8.1-nomkl-msvc-win-x64-cp311
          path: ct2-dist/
          if-no-files-found: error
          retention-days: 30
