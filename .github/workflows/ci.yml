# Windows / macOS の両方でテストを回し、片方だけ壊れる変更をpush時に検出する。
# モデルDL・音声デバイスは不要な範囲（unit + サーバAPI）に限定している。
name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]   # macos-15 = Apple Silicon (arm64)。macos-14 は 2026-11 に提供終了
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
